# Save this file to: .github/workflows/metrics.yml
# Docs: https://github.com/lowlighter/metrics

name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]   # runs daily at midnight UTC
  workflow_dispatch:                # lets you trigger it manually from the Actions tab
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # --- base header/repos/stars stats ---
          base: header, activity, community, repositories, metadata

          # --- theme, matches your existing dark/pink palette ---
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14

          plugin_habits: yes
          plugin_habits_charts: languages, commits
          plugin_habits_days: 14
          plugin_habits_facts: yes

          plugin_topics: yes
          plugin_topics_mode: icons

          plugin_achievements: yes
          plugin_achievements_display: compact
